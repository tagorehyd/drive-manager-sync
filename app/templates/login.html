{% extends "base.html" %}
{% block title %}Drive Manager · Sign in{% endblock %}
{% block body %}
<main class="max-w-sm mx-auto mt-24 px-4">
  <h1 class="text-2xl font-semibold mb-6 text-center">Drive Manager</h1>
  <form method="post" action="/login" class="card space-y-4">
    {% if error %}<p class="text-red-700 bg-red-50 border border-red-200 rounded p-2 text-sm">{{ error }}</p>{% endif %}
    <label class="block"><span class="lbl">Username</span>
      <input class="inp" name="username" autocomplete="username" required autofocus></label>
    <label class="block"><span class="lbl">Password</span>
      <input class="inp" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary w-full">Sign in</button>
  </form>
</main>
{% endblock %}
